name: ci
on: [push, pull_request]
jobs:
  js:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          NPM_CONFIG_CACHE: ./.npm-cache
      - run: npm audit --audit-level=high
        env:
          NPM_CONFIG_CACHE: ./.npm-cache
  css:
    # P2-10: stale-CSS guard — committed tailwind.css must match the generator.
    # Guard is node (tools/check-css.mjs) — no Python needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:css
        env:
          NPM_CONFIG_CACHE: ./.npm-cache
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --manifest-path backend/src/Cargo.toml
        env:
          CARGO_TARGET_DIR: ./backend/src/target
      - run: cargo clippy --manifest-path backend/src/Cargo.toml -- -D warnings
        env:
          CARGO_TARGET_DIR: ./backend/src/target
      - run: cargo fmt --manifest-path backend/src/Cargo.toml -- --check
  audit-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./backend/src
